name: Errores de precio RSS
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar mensaje de prueba"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: errores-rss
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Buscar errores de precio
        run: python errores_rss.py ${{ inputs.prueba && '--prueba' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
      - name: Guardar avisos ya enviados
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add rss_vistos.json || true
          git diff --cached --quiet || git commit -m "errores rss vistos"
          git pull --rebase -X theirs origin main
          git push
